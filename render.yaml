# Render Blueprint — https://render.com/docs/blueprint-spec
# Dashboard: New → Blueprint → conectar este repositório
# Ou crie um Web Service manual com os mesmos comandos/envs abaixo.

services:
  - type: web
    name: recadastramento-harf
    runtime: node
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "20.19.0"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_URL
        sync: false
      - key: ADMIN_SARAM
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NOME
        value: Administrador TI
